<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskLink</title>
<style>
  :root{
    --bg:#FAF9F5;
    --card:#FFFFFF;
    --ink:#1C2321;
    --ink-soft:#5A6660;
    --ochre:#C97A2B;
    --ochre-dark:#A9611E;
    --teal:#2D5A4A;
    --teal-soft:#E4EEE9;
    --line:#E4E1D8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;
    line-height:1.6;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:0 18px 60px; }

  /* top bar */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 0 10px;
  }
  .brand{ font-size:19px; font-weight:800; letter-spacing:.2px; }
  .brand span{ color:var(--ochre); }
  .lang-toggle{
    display:flex; border:1.5px solid var(--line); border-radius:20px; overflow:hidden;
  }
  .lang-toggle button{
    border:none; background:var(--card); padding:6px 14px; font-size:12.5px;
    font-weight:700; cursor:pointer; color:var(--ink-soft);
  }
  .lang-toggle button.active{ background:var(--teal); color:#fff; }

  /* hero */
  .hero{ padding:24px 0 10px; text-align:center; }
  .hero h1{
    font-size:26px; line-height:1.35; margin:0 0 12px; font-weight:800;
  }
  .hero p{ color:var(--ink-soft); font-size:15px; margin:0 0 22px; }
  .cta-primary{
    display:inline-block; background:var(--ochre); color:#fff; text-decoration:none;
    font-weight:700; font-size:15px; padding:13px 28px; border-radius:30px;
    box-shadow:0 6px 16px rgba(201,122,43,.28);
    border:none; cursor:pointer;
  }

  /* problem */
  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:18px; margin:14px 0;
  }
  .problem-line{
    display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; font-size:14.5px;
  }
  .problem-line:last-child{ margin-bottom:0; }
  .problem-line .dot{
    width:7px; height:7px; border-radius:50%; background:var(--ochre); margin-top:8px; flex-shrink:0;
  }

  /* how it works */
  .section-title{ font-size:19px; font-weight:800; margin:30px 0 14px; }
  .step{
    display:flex; gap:14px; align-items:flex-start; margin-bottom:16px;
  }
  .step-num{
    width:30px; height:30px; border-radius:50%; background:var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
    flex-shrink:0; font-family:'Courier New',monospace;
  }
  .step-text b{ display:block; font-size:15px; margin-bottom:2px; }
  .step-text span{ font-size:13.5px; color:var(--ink-soft); }

  /* pricing */
  .price-card{
    background:var(--teal); color:#fff; border-radius:16px; padding:22px; text-align:center;
    margin:16px 0;
  }
  .price-card .badge{
    display:inline-block; background:rgba(255,255,255,.15); font-size:11.5px; font-weight:700;
    padding:4px 12px; border-radius:20px; margin-bottom:10px;
  }
  .price-card .amount{ font-size:15px; opacity:.92; margin:6px 0 4px; }
  .price-card .note{ font-size:12.5px; opacity:.75; }

  /* form */
  .form-section{ margin-top:6px; }
  .form-row{ margin-bottom:12px; }
  .form-row label{ display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--ink-soft); }
  .form-row input, .form-row select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14.5px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .form-row input:focus, .form-row select:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  .btn-submit{
    width:100%; background:var(--ochre); color:#fff; border:none; border-radius:8px;
    padding:14px; font-size:15.5px; font-weight:700; cursor:pointer; margin-top:6px;
  }
  .btn-submit:active{ background:var(--ochre-dark); }

  .footer-note{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:20px; }

  .thankyou{
    display:none; text-align:center; padding:30px 14px;
  }
  .thankyou.show{ display:block; }
  .thankyou .check{
    width:52px; height:52px; border-radius:50%; background:var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:26px;
  }
  .thankyou h2{ margin:0 0 8px; font-size:19px; }
  .thankyou p{ color:var(--ink-soft); font-size:14px; }

  [data-lang="en"] body{ direction:ltr; }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="brand">TaskLink<span>.</span></div>
    <div class="lang-toggle">
      <button id="btn-ar" class="active" onclick="setLang('ar')">ع</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="hero">
    <h1 data-ar="خلّي زبائنك يحجزو معاك مباشرة، بلا واتساب، بلا نسيان مواعيد"
        data-en="Let your clients book with you directly — no WhatsApp back-and-forth, no missed appointments">
    </h1>
    <p data-ar="منصة بسيطة تجيب لك حجوزات جديدة وتنظم أوقاتك، مخصصة للمهنيين الصغار فالجزائر"
       data-en="A simple platform that brings you new bookings and organizes your schedule — built for independent professionals in Algeria">
    </p>
    <button class="cta-primary" onclick="scrollToForm()"
            data-ar="سجل مجاناً كأول مهني" data-en="Join free as a founding professional"></button>
  </div>

  <div class="card">
    <div class="problem-line">
      <div class="dot"></div>
      <div data-ar="كتضيع وقت تجاوب على رسائل واتساب باش تأكد موعد بسيط"
           data-en="You waste time replying to WhatsApp messages just to confirm a simple appointment"></div>
    </div>
    <div class="problem-line">
      <div class="dot"></div>
      <div data-ar="الزبون كينسى الموعد ويجيك غياب بلا تعويض"
           data-en="Clients forget their appointment and you're left with an empty slot"></div>
    </div>
    <div class="problem-line">
      <div class="dot"></div>
      <div data-ar="ما عندكش صورة واضحة على أوقاتك المتاحة فاليوم"
           data-en="You don't have a clear view of your available slots for the day"></div>
    </div>
  </div>

  <div class="section-title" data-ar="كيفاش تخدم" data-en="How it works"></div>

  <div class="step">
    <div class="step-num">1</div>
    <div class="step-text">
      <b data-ar="تسجل بروفايلك" data-en="Create your profile"></b>
      <span data-ar="اسمك، خدماتك، أسعارك، والأوقات اللي متاح فيها"
            data-en="Your name, services, prices, and the hours you're available"></span>
    </div>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-text">
      <b data-ar="الزبون يحجز مباشرة" data-en="Clients book directly"></b>
      <span data-ar="يبحث عليك حسب مدينتك ونوع خدمتك، ويختار وقت فاضي"
            data-en="They find you by city and service, then pick an open slot"></span>
    </div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-text">
      <b data-ar="تتأكد وتخدم" data-en="You confirm and get to work"></b>
      <span data-ar="تجيك إشعار بالحجز، وموعدك يتزاد فالتقويم تاعك مباشرة"
            data-en="You get notified, and the slot is added straight to your schedule"></span>
    </div>
  </div>

  <div class="price-card">
    <div class="badge" data-ar="عرض الانطلاقة" data-en="Launch offer"></div>
    <div style="font-size:22px;font-weight:800;" data-ar="مجاني لأول 20 مهني"
         data-en="Free for the first 20 professionals"></div>
    <div class="amount" data-ar="بعدها: اشتراك شهري بسيط، بلا عمولات مخفية"
         data-en="After that: a simple monthly subscription, no hidden commissions"></div>
    <div class="note" data-ar="ما كاين حتى التزام، تقدر توقف فأي وقت"
         data-en="No commitment — cancel anytime"></div>
  </div>

  <div id="form-section" class="card form-section">
    <div class="section-title" style="margin-top:0;" data-ar="سجل مكانك دابا" data-en="Reserve your spot now"></div>

    <form id="signup-form">
      <div class="form-row">
        <label data-ar="الاسم الكامل" data-en="Full name"></label>
        <input type="text" id="f-name" required>
      </div>
      <div class="form-row">
        <label data-ar="المهنة" data-en="Profession"></label>
        <input type="text" id="f-profession" placeholder="مثلاً: مدرب رياضي" required>
      </div>
      <div class="form-row">
        <label data-ar="المدينة" data-en="City"></label>
        <input type="text" id="f-city" required>
      </div>
      <div class="form-row">
        <label data-ar="رقم الهاتف أو واتساب" data-en="Phone / WhatsApp number"></label>
        <input type="text" id="f-phone" required>
      </div>
      <button type="submit" class="btn-submit" data-ar="سجلني" data-en="Sign me up"></button>
    </form>

    <div id="thankyou" class="thankyou">
      <div class="check">✓</div>
      <h2 data-ar="تسجلت بنجاح!" data-en="You're in!"></h2>
      <p data-ar="غادي نتواصلو معاك قريب باش نكملو التفاصيل"
         data-en="We'll be in touch soon to finalize the details"></p>
    </div>
  </div>

  <p class="footer-note" data-ar="بياناتك تستعمل فقط باش نتواصلو معاك بخصوص المنصة"
     data-en="Your details are used only to contact you about the platform"></p>

</div>

<script>
// ⚠️ عدّل هذا البريد لبريدك الشخصي باش توصلك التسجيلات
// ⚠️ Replace this email with your own so signups reach you
const OWNER_EMAIL = "REPLACE_WITH_YOUR_EMAIL@example.com";

function setLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('btn-ar').classList.toggle('active', lang==='ar');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.querySelectorAll('[data-ar]').forEach(el=>{
    el.textContent = lang==='ar' ? el.dataset.ar : el.dataset.en;
  });
  document.querySelectorAll('input, button[type=submit]').forEach(()=>{});
  document.getElementById('f-profession').placeholder = lang==='ar' ? 'مثلاً: مدرب رياضي' : 'e.g. fitness coach';
  localStorage.setItem('tasklink_lang', lang);
}

function scrollToForm(){
  document.getElementById('form-section').scrollIntoView({behavior:'smooth'});
}

document.getElementById('signup-form').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const profession = document.getElementById('f-profession').value.trim();
  const city = document.getElementById('f-city').value.trim();
  const phone = document.getElementById('f-phone').value.trim();

  // نخزنو نسخة محلياً كنسخة احتياطية
  try{
    const entries = JSON.parse(localStorage.getItem('tasklink_signups') || '[]');
    entries.push({name, profession, city, phone, date: new Date().toISOString()});
    localStorage.setItem('tasklink_signups', JSON.stringify(entries));
  }catch(err){ console.error(err); }

  // نفتحو بريد جاهز بالمعلومات باش توصل للمالك
  const subject = encodeURIComponent('تسجيل مهني جديد - TaskLink');
  const body = encodeURIComponent(
    `الاسم: ${name}\nالمهنة: ${profession}\nالمدينة: ${city}\nالهاتف: ${phone}`
  );
  window.location.href = `mailto:${OWNER_EMAIL}?subject=${subject}&body=${body}`;

  document.getElementById('signup-form').style.display = 'none';
  document.getElementById('thankyou').classList.add('show');
});

// استرجاع اللغة المحفوظة
const savedLang = localStorage.getItem('tasklink_lang');
if(savedLang) setLang(savedLang);
</script>

</body>
        </html>
